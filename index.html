<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mPOS Core Engine — Institutional Terminal</title>
    <style>
        :root {
            --bg-dark: #0A192F;
            --card-dark: #112240;
            --mpos-gold: #C9972B;
            --mpos-blue: #58a6ff;
            --text-main: #ccd6f6;
            --text-dim: #8892b0;
            --success: #64ffda;
            --danger: #f7567c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-dark); color: var(--text-main); line-height: 1.6; }

        /* HEADER */
        .top-nav { background: #020c1b; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #233554; }
        .logo { font-weight: 800; color: var(--mpos-gold); font-size: 22px; letter-spacing: 2px; }
        .engine-status { font-size: 11px; color: var(--success); font-weight: 700; background: rgba(100, 255, 218, 0.1); padding: 5px 15px; border-radius: 20px; }

        /* MAIN LAYOUT */
        .grid-container { max-width: 1200px; margin: 30px auto; display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; padding: 0 20px; }

        .card { background: var(--card-dark); border-radius: 12px; padding: 25px; border: 1px solid #233554; margin-bottom: 25px; }
        .card-header { border-bottom: 1px solid #233554; margin-bottom: 20px; padding-bottom: 10px; font-weight: 700; color: var(--mpos-gold); text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }

        /* INPUTS */
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; }
        input, select { width: 100%; padding: 12px; background: #020c1b; border: 1px solid #233554; border-radius: 6px; color: white; font-size: 15px; }
        input:focus { border-color: var(--mpos-blue); outline: none; }

        button { width: 100%; padding: 15px; background: var(--mpos-gold); color: #020c1b; border: none; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 14px; transition: transform 0.2s; }
        button:hover { opacity: 0.9; transform: translateY(-2px); }

        /* ENGINE VISUALIZER */
        .engine-log { font-family: 'Consolas', monospace; font-size: 12px; background: #020c1b; padding: 15px; border-radius: 8px; max-height: 250px; overflow-y: auto; }
        .log-entry { margin-bottom: 8px; border-left: 2px solid var(--text-dim); padding-left: 10px; }
        .log-entry.active { border-color: var(--success); color: var(--success); }

        /* AGENT GRID */
        .agent-list { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .agent-card { background: #172a45; padding: 15px; border-radius: 8px; font-size: 12px; }
        .agent-val { font-weight: 700; color: var(--success); font-size: 16px; }
        .agent-label { color: var(--text-dim); margin-top: 5px; display: block; }

        /* ANIMATION */
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .processing { animation: pulse 1s infinite; color: var(--mpos-gold); font-weight: bold; }
    </style>
</head>
<body>

<nav class="top-nav">
    <div class="logo">mPOS ENGINE v2.0</div>
    <div class="engine-status">● SETTLEMENT LAYER ONLINE</div>
</nav>

<div class="grid-container">
    
    <section>
        <div class="card">
            <div class="card-header">Initiate International Transfer</div>
            <div class="input-group">
                <label>Bank Authorization Token</label>
                <input type="text" id="bank_token" value="BANK-AUTH-9921-X" disabled>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="input-group">
                    <label>Amount (GBP)</label>
                    <input type="number" id="send_amt" placeholder="1000">
                </div>
                <div class="input-group">
                    <label>Target Corridor</label>
                    <select>
                        <option>UK → Nigeria (NGN)</option>
                    </select>
                </div>
            </div>
            <button onclick="runEngine()">Process mPOS Settlement</button>
        </div>

        <div class="card">
            <div class="card-header">Live Engine Logic Manifest</div>
            <div id="engine_log" class="engine-log">
                <div class="log-entry">Waiting for bank instruction...</div>
            </div>
        </div>
    </section>

    <aside>
        <div class="card">
            <div class="card-header">Nigeria Liquidity Facilitators</div>
            <div class="agent-list" id="ng_agents">
                </div>
        </div>

        <div class="card">
            <div class="card-header">UK Recipient Agents</div>
            <div class="agent-list" id="uk_agents">
                </div>
        </div>

        <div class="card">
            <div class="card-header">Stability Control (3-Day Rule)</div>
            <p style="font-size: 11px; color: var(--text-dim); margin-bottom: 15px;">
                Holdings exceeding 72 hours trigger automatic corridor balancing.
            </p>
            <button style="background: var(--danger); color: white;" onclick="simulateStagnation()">Force Auto-Conversion</button>
        </div>
    </aside>
</div>

<script>
    // System State
    const state = {
        ngAgents: [
            { id: "NG-FAC-01", fiat: 5000000, ledger: 15000 },
            { id: "NG-FAC-02", fiat: 8200000, ledger: 4000 }
        ],
        ukAgents: [
            { id: "UK-REC-01", fiat: 20000, ledger: 0 },
            { id: "UK-REC-02", fiat: 15000, ledger: 0 }
        ],
        rate: 1850
    };

    function renderAgents() {
        const ngHtml = state.ngAgents.map(a => `
            <div class="agent-card">
                <span style="color: var(--mpos-gold)">${a.id}</span>
                <span class="agent-label">Local Fiat: <span class="agent-val">₦${a.fiat.toLocaleString()}</span></span>
                <span class="agent-label">Intl Balance: <span style="color: var(--mpos-blue)">£${a.ledger.toLocaleString()}</span></span>
            </div>
        `).join('');

        const ukHtml = state.ukAgents.map(a => `
            <div class="agent-card">
                <span style="color: var(--mpos-gold)">${a.id}</span>
                <span class="agent-label">Local Fiat: <span class="agent-val">£${a.fiat.toLocaleString()}</span></span>
                <span class="agent-label">Intl Balance: <span style="color: var(--mpos-blue)">£${a.ledger.toLocaleString()}</span></span>
            </div>
        `).join('');

        document.getElementById('ng_agents').innerHTML = ngHtml;
        document.getElementById('uk_agents').innerHTML = ukHtml;
    }

    function addLog(msg, isProcessing = false) {
        const log = document.getElementById('engine_log');
        const div = document.createElement('div');
        div.className = 'log-entry active';
        if (isProcessing) div.classList.add('processing');
        div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        log.prepend(div);
    }

    async function runEngine() {
        const amt = parseFloat(document.getElementById('send_amt').value);
        if (!amt) return alert("Enter amount");

        addLog("BANK_AUTH_SUCCESS: Received instruction for £" + amt);
        await new Promise(r => setTimeout(r, 800));

        addLog("SCANNING: Locating accredited facilitators in Nigeria corridor...");
        await new Promise(r => setTimeout(r, 800));

        // Logic: Pick random agents
        const ngIdx = Math.floor(Math.random() * 2);
        const ukIdx = Math.floor(Math.random() * 2);
        const facilitator = state.ngAgents[ngIdx];
        const recipient = state.ukAgents[ukIdx];

        addLog(`MATCHED: ${facilitator.id} (NG) matched with ${recipient.id} (UK)`);
        await new Promise(r => setTimeout(r, 800));

        // Execution
        const ngnVal = amt * state.rate;
        facilitator.fiat += ngnVal;
        facilitator.ledger -= amt;

        recipient.fiat -= amt;
        recipient.ledger += (amt * 0.998); // 0.2% buffer deducted

        addLog(`ROUTING: Crediting NGN ${ngnVal.toLocaleString()} to ${facilitator.id}`);
        addLog(`ROUTING: Deducting £${amt} from ${recipient.id} to satisfy payout`);
        
        await new Promise(r => setTimeout(r, 800));
        addLog("SETTLEMENT_COMPLETE: International Ledger Adjusted.");
        renderAgents();
    }

    function simulateStagnation() {
        addLog("WATCHDOG_ALERT: Agent NG-FAC-01 holding ledger balance > 72hrs");
        setTimeout(() => {
            const agent = state.ngAgents[0];
            const fee = agent.ledger * 0.0008;
            addLog(`AUTO_CONVERT: Executed at 0.08% penalty. Stability restored.`);
            agent.fiat += (agent.ledger * state.rate) - (fee * state.rate);
            agent.ledger = 0;
            renderAgents();
        }, 1000);
    }

    // Initial Load
    renderAgents();
</script>
</body>
</html>
