<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mPOS Core Settlement Simulation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: #c9d1d9; padding: 20px; }
        
        /* CONTAINER STYLE */
        .mpos-container { max-width: 600px; margin: 50px auto; background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* HEADER */
        .header { border-bottom: 1px solid #30363d; margin-bottom: 25px; padding-bottom: 10px; text-align: center; }
        .header h1 { color: #58a6ff; font-size: 24px; }
        .header p { font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }

        /* FORM ELEMENTS */
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #8b949e; }
        input { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 16px; }
        button { width: 100%; padding: 15px; background-color: #238636; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #2ea043; }

        /* RESULTS AREA */
        #ledger-output { margin-top: 25px; background: #0d1117; border-radius: 6px; padding: 20px; border-left: 4px solid #58a6ff; display: none; }
        .manifest-line { display: flex; justify-content: space-between; margin-bottom: 10px; font-family: 'Courier New', Courier, monospace; font-size: 14px; }
        .highlight { color: #58a6ff; font-weight: bold; }
        .penalty { color: #f85149; }
        .standard { color: #3fb950; }
    </style>
</head>
<body>

    <div class="mpos-container">
        <div class="header">
            <h1>mPOS Engine v1.1</h1>
            <p>Institutional Settlement Simulation</p>
        </div>

        <div class="input-group">
            <label>Digital Passport (DP-ID)</label>
            <input type="text" id="dp_id" placeholder="e.g. DP-8822-X">
        </div>

        <div class="input-group">
            <label>Principal Amount (GBP)</label>
            <input type="number" id="principal" placeholder="1000">
        </div>

        <div class="input-group">
            <label>FX Rate (To Destination)</label>
            <input type="number" id="rate" placeholder="1850">
        </div>

        <div class="input-group">
            <label>Settlement Delay (Days)</label>
            <input type="number" id="delay" placeholder="1">
        </div>

        <button onclick="executeSettlement()">Execute Settlement</button>

        <div id="ledger-output">
            <div style="text-align: center; margin-bottom: 15px; font-weight: bold; font-size: 12px; color: #8b949e;">SETTLEMENT MANIFEST</div>
            <div class="manifest-line"><span>Status:</span> <span id="out-status"></span></div>
            <div class="manifest-line"><span>Gross Value:</span> <span id="out-gross"></span></div>
            <div class="manifest-line"><span>0.2% Buffer:</span> <span id="out-buffer" style="color: #f85149;"></span></div>
            <div class="manifest-line"><span>Service Fee:</span> <span id="out-fee"></span></div>
            <hr style="border: 0; border-top: 1px dashed #30363d; margin: 10px 0;">
            <div class="manifest-line"><span style="font-weight: bold;">Final Payout:</span> <span id="out-payout" class="highlight"></span></div>
        </div>
    </div>

    <script>
        function executeSettlement() {
            // Inputs
            const dp = document.getElementById('dp_id').value;
            const principal = parseFloat(document.getElementById('principal').value);
            const rate = parseFloat(document.getElementById('rate').value);
            const delay = parseInt(document.getElementById('delay').value);

            if (!dp || isNaN(principal) || isNaN(rate)) {
                alert("Identity and Financial parameters required.");
                return;
            }

            // mPOS Mathematical Constraints
            const BUFFER_RATE = 0.002;  // 0.2%
            const FEE_STANDARD = 0.0005; // 0.05%
            const FEE_PENALTY = 0.0008;  // 0.08%

            // Logic Execution
            const gross = principal * rate;
            const buffer = gross * BUFFER_RATE;
            const net_before_fee = gross - buffer;

            // 72-Hour Rule Enforcement
            let fee_applied;
            let status_text;
            let status_class;

            if (delay <= 3) {
                fee_applied = net_before_fee * FEE_STANDARD;
                status_text = "STANDARD_VELOCITY";
                status_class = "standard";
            } else {
                fee_applied = net_before_fee * FEE_PENALTY;
                status_text = "STAGNANT_AUTO_PENALTY";
                status_class = "penalty";
            }

            const final_payout = net_before_fee - fee_applied;

            // UI Update
            document.getElementById('out-status').innerText = status_text;
            document.getElementById('out-status').className = 'manifest-line ' + status_class;
            document.getElementById('out-gross').innerText = gross.toLocaleString() + " NGN";
            document.getElementById('out-buffer').innerText = "-" + buffer.toLocaleString() + " NGN";
            document.getElementById('out-fee').innerText = "-" + fee_applied.toLocaleString() + " NGN";
            document.getElementById('out-payout').innerText = final_payout.toLocaleString() + " NGN";
            
            document.getElementById('ledger-output').style.display = 'block';
        }
    </script>
</body>
</html>
